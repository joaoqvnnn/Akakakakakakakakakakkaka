<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dados bancários | Larizinha Store</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand">
        <div class="brand-badge">LS</div>
        <span>Saque afiliado</span>
      </div>
      <button class="theme-toggle" type="button" id="themeBtn">Tema escuro</button>
    </div>

    <nav class="nav-menu">
      <a class="active" href="/saque/form">Saque</a>
      <a href="/historico">Histórico</a>
      <a href="/termos">Termos</a>
    </nav>

    <div class="card">
      <h1>Transferência bancária</h1>
      <p class="subtitle">
        Selecione o banco, agência, conta e dígito. Confirme com a senha de saque do Telegram.
      </p>

      <div class="amount-box">
        <span class="hint">Valor do saque</span>
        <strong id="amountLabel">Carregando…</strong>
        <span class="hint">Ref: <span id="uuidLabel">—</span></span>
      </div>

      <div id="msg" style="display:none;" class="alert"></div>

      <form id="bankForm">
        <label for="bank">Banco</label>
        <select id="bank" name="bank_code" required></select>

        <div class="grid-2">
          <div>
            <label for="agency">Agência</label>
            <input id="agency" name="agency" inputmode="numeric" placeholder="0001" required />
          </div>
          <div>
            <label for="agency_digit">Dígito agência</label>
            <input id="agency_digit" name="agency_digit" maxlength="2" placeholder="0" />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="account">Número da conta</label>
            <input id="account" name="account" inputmode="numeric" required />
          </div>
          <div>
            <label for="account_digit">Dígito da conta</label>
            <input id="account_digit" name="account_digit" maxlength="2" required />
          </div>
        </div>

        <label for="account_type">Tipo de conta</label>
        <select id="account_type" required>
          <option value="checking">Corrente</option>
          <option value="savings">Poupança</option>
          <option value="payment">Pagamento</option>
        </select>

        <label for="holder_name">Nome do titular</label>
        <input id="holder_name" required />

        <label for="holder_document">CPF do titular</label>
        <input id="holder_document" inputmode="numeric" placeholder="000.000.000-00" required />

        <label for="withdraw_password">Senha de saque (Telegram)</label>
        <input id="withdraw_password" type="password" required />

        <button class="btn" type="submit">Confirmar e solicitar transferência</button>
        <button class="btn btn-secondary" type="button" id="btnPix">Prefiro Pix no Telegram</button>
      </form>
    </div>
    <div class="footer">Conectado ao bot Telegram</div>
  </div>

  <script src="/static/js/banks.js"></script>
  <script>
    const THEME_KEY = "ls_theme";
    const PASS_KEY = "ls_web_pass_ok";
    if (sessionStorage.getItem(PASS_KEY) !== "1") {
      const u = location.pathname.split("/")[2];
      location.href = u && u !== "form" ? "/saque/" + u : "/login";
    }

    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      document.getElementById("themeBtn").textContent =
        t === "dark" ? "Tema claro" : "Tema escuro";
      localStorage.setItem(THEME_KEY, t);
    }
    applyTheme(localStorage.getItem(THEME_KEY) || "light");
    document.getElementById("themeBtn").onclick = () => {
      const cur = document.documentElement.getAttribute("data-theme");
      applyTheme(cur === "dark" ? "light" : "dark");
    };

    const pathParts = location.pathname.split("/").filter(Boolean);
    let uuid = sessionStorage.getItem("ls_saque_uuid") || "";
    if (pathParts[0] === "saque" && pathParts[1] && pathParts[1] !== "form") {
      uuid = pathParts[1];
      sessionStorage.setItem("ls_saque_uuid", uuid);
    }
    document.getElementById("uuidLabel").textContent = uuid || "—";
    fillBanksSelect(document.getElementById("bank"));

    async function loadInfo() {
      if (!uuid) {
        document.getElementById("amountLabel").textContent = "R$ — (sem UUID)";
        return;
      }
      try {
        const r = await fetch("/api/saque/" + encodeURIComponent(uuid));
        const data = await r.json();
        if (data.ok) {
          document.getElementById("amountLabel").textContent =
            "R$ " + Number(data.amount).toFixed(2).replace(".", ",");
        } else {
          document.getElementById("amountLabel").textContent = "Saque não encontrado";
        }
      } catch (e) {
        document.getElementById("amountLabel").textContent = "API offline (layout ok)";
      }
    }
    loadInfo();

    function onlyDigits(v) { return (v || "").replace(/\D/g, ""); }
    function validCpf(cpf) {
      cpf = onlyDigits(cpf);
      if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
      let s = 0;
      for (let i = 0; i < 9; i++) s += +cpf[i] * (10 - i);
      let d = (s * 10) % 11; if (d === 10) d = 0;
      if (d !== +cpf[9]) return false;
      s = 0;
      for (let i = 0; i < 10; i++) s += +cpf[i] * (11 - i);
      d = (s * 10) % 11; if (d === 10) d = 0;
      return d === +cpf[10];
    }

    document.getElementById("bankForm").onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      if (!uuid) {
        msg.className = "alert alert-err"; msg.style.display = "block";
        msg.textContent = "UUID do saque ausente. Abra o link enviado no Telegram.";
        return;
      }
      const payload = {
        bank_code: document.getElementById("bank").value,
        bank_name: document.getElementById("bank").selectedOptions[0].textContent,
        agency: onlyDigits(document.getElementById("agency").value),
        agency_digit: document.getElementById("agency_digit").value.trim(),
        account: onlyDigits(document.getElementById("account").value),
        account_digit: document.getElementById("account_digit").value.trim(),
        account_type: document.getElementById("account_type").value,
        holder_name: document.getElementById("holder_name").value.trim(),
        holder_document: onlyDigits(document.getElementById("holder_document").value),
        withdraw_password: document.getElementById("withdraw_password").value,
      };
      if (!payload.bank_code || !validCpf(payload.holder_document)) {
        msg.className = "alert alert-err"; msg.style.display = "block";
        msg.textContent = "Banco ou CPF inválido.";
        return;
      }
      try {
        const r = await fetch("/api/saque/" + encodeURIComponent(uuid), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await r.json();
        msg.style.display = "block";
        if (data.ok) {
          msg.className = "alert alert-ok";
          msg.textContent = data.message || "Dados salvos com sucesso.";
        } else {
          msg.className = "alert alert-err";
          msg.textContent = data.error || "Falha ao salvar.";
        }
      } catch (err) {
        msg.className = "alert alert-err"; msg.style.display = "block";
        msg.textContent = "Não foi possível falar com a API. Servidor offline?";
      }
    };

    document.getElementById("btnPix").onclick = () => {
      alert("Pix é feito no Telegram: Afiliados → Solicitar Saque → Pix.");
    };
  </script>
</body>
</html>
